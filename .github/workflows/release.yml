# Tag vX.Y.Z → push ghcr.io/<owner>/<repo>:{X.Y.Z,latest} and create a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "img=$img" >> "$GITHUB_OUTPUT"
          echo "tags=$img:${GITHUB_REF_NAME#v},$img:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_HASH=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.img }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.img }}:buildcache,mode=max
          push: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
